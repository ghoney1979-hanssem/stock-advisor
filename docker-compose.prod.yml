# 운영 배포용 풀스택 (앱 + PostgreSQL + Redis) — 단일 VM(GCE e2-medium)에서 실행
# 사용:  docker compose -f docker-compose.prod.yml up -d --build
# 시크릿은 .env 파일에서 주입 (.env.example 참고, .env 는 커밋 금지)
services:
  postgres:
    image: postgres:16-alpine
    container_name: sa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stockadvisor}
      POSTGRES_USER: ${DB_USERNAME:-stockadvisor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stockadvisor}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sa-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: sa-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms512m -Xmx1500m"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-stockadvisor}
      DB_USERNAME: ${DB_USERNAME:-stockadvisor}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 외부 API/알림 시크릿 (.env)
      DART_API_KEY: ${DART_API_KEY}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      # 실전 매매 정책 — 미지정 시 안전 기본(꺼짐+DRY_RUN). go-live 시 .env 에서 켬.
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
      TRADING_MODE: ${TRADING_MODE:-DRY_RUN}
      TRADING_MAX_ORDER_PCT: ${TRADING_MAX_ORDER_PCT:-0}
      TRADING_MAX_ORDERS_PER_DAY: ${TRADING_MAX_ORDERS_PER_DAY:-0}
      TRADING_DAILY_LOSS_LIMIT: ${TRADING_DAILY_LOSS_LIMIT:-50000}
      TRADING_DAILY_LOSS_LIMIT_PCT: ${TRADING_DAILY_LOSS_LIMIT_PCT:-0}
      TRADING_MAX_POSITIONS: ${TRADING_MAX_POSITIONS:-20}
      TRADING_SESSION_END: ${TRADING_SESSION_END:-15:20}
      TRADING_TIME_EXIT_HOLD_MINUTES: ${TRADING_TIME_EXIT_HOLD_MINUTES:-60}
      TRADING_MANUAL_CONFIRM: ${TRADING_MANUAL_CONFIRM:-true}
      TRADING_LIVE_STRATEGIES: ${TRADING_LIVE_STRATEGIES:-}
      TRADING_MULTIDAY_STRATEGIES: ${TRADING_MULTIDAY_STRATEGIES:-MEAN_REVERSION_C,INDEX_RELATIVE_D,VALUE_REVERSAL_J}
      TRADING_MULTIDAY_MAX_HOLD_DAYS: ${TRADING_MULTIDAY_MAX_HOLD_DAYS:-15}
      TRADING_UNFILLED_TIMEOUT_MINUTES: ${TRADING_UNFILLED_TIMEOUT_MINUTES:-3}
      TRADING_APPROVAL_TIMEOUT_MINUTES: ${TRADING_APPROVAL_TIMEOUT_MINUTES:-5}
      TRADING_RISK_CRASH_HALT_PCT: ${TRADING_RISK_CRASH_HALT_PCT:-3.0}
      TRADING_RISK_REBOUND_PCT: ${TRADING_RISK_REBOUND_PCT:-2.0}
      TRADING_RISK_BULL_EXPOSURE_PCT: ${TRADING_RISK_BULL_EXPOSURE_PCT:-100}
      TRADING_RISK_NEUTRAL_EXPOSURE_PCT: ${TRADING_RISK_NEUTRAL_EXPOSURE_PCT:-80}
      TRADING_RISK_BEAR_EXPOSURE_PCT: ${TRADING_RISK_BEAR_EXPOSURE_PCT:-60}
      TRADING_RISK_HIGH_VOL_MULT: ${TRADING_RISK_HIGH_VOL_MULT:-0.5}
      TRADING_RISK_BREADTH_ADV_PCT: ${TRADING_RISK_BREADTH_ADV_PCT:-15.0}
      TRADING_RISK_BREADTH_MEDIAN_PCT: ${TRADING_RISK_BREADTH_MEDIAN_PCT:-3.0}
      # 개장 창 노출 상한(0=비활성) — 리스크 예산 선착순 배분 완화. 켜려면 .env에 25 등 지정
      TRADING_RISK_OPENING_EXPOSURE_CAP_PCT: ${TRADING_RISK_OPENING_EXPOSURE_CAP_PCT:-0}
      TRADING_RISK_OPENING_WINDOW_MINUTES: ${TRADING_RISK_OPENING_WINDOW_MINUTES:-30}
      # 시장폭 스냅샷 최소 커버리지(부분 스캔이 정상 스냅샷을 덮는 것 방지)
      SIGNAL_BREADTH_MIN_COVERAGE_RATIO: ${SIGNAL_BREADTH_MIN_COVERAGE_RATIO:-0.8}
      # 유니버스 스냅샷(전 종목 feature 수집 — P(승자|feature)의 분모). 추가 KIS 0
      SIGNAL_UNIVERSE_SNAPSHOT_ENABLED: ${SIGNAL_UNIVERSE_SNAPSHOT_ENABLED:-true}
      SIGNAL_UNIVERSE_SNAPSHOT_TIMES: ${SIGNAL_UNIVERSE_SNAPSHOT_TIMES:-09:30,11:00,13:00,14:30}
      SIGNAL_UNIVERSE_SNAPSHOT_WINDOW_MINUTES: ${SIGNAL_UNIVERSE_SNAPSHOT_WINDOW_MINUTES:-20}
      SIGNAL_UNIVERSE_SNAPSHOT_TARGET_MINUTES: ${SIGNAL_UNIVERSE_SNAPSHOT_TARGET_MINUTES:-90}
      TRADING_ROUND_TRIP_COST_PCT: ${TRADING_ROUND_TRIP_COST_PCT:-0.22}
      MARKET_REGIME_MA_PERIOD: ${MARKET_REGIME_MA_PERIOD:-3}
      MARKET_REGIME_SLOPE_LOOKBACK: ${MARKET_REGIME_SLOPE_LOOKBACK:-2}
      MARKET_REGIME_INTRADAY_DEMOTE_PCT: ${MARKET_REGIME_INTRADAY_DEMOTE_PCT:-2.0}
      MARKET_REGIME_INTRADAY_PROMOTE_PCT: ${MARKET_REGIME_INTRADAY_PROMOTE_PCT:-2.0}
      MARKET_REGIME_UPGRADE_MIN_HOLD_MINUTES: ${MARKET_REGIME_UPGRADE_MIN_HOLD_MINUTES:-30}
      INVERSE_CODES: ${INVERSE_CODES:-114800,251340}
      TRADING_PERF_GATE_ENABLED: ${TRADING_PERF_GATE_ENABLED:-true}
      TRADING_PERF_GATE_MIN_SAMPLES: ${TRADING_PERF_GATE_MIN_SAMPLES:-30}
      TRADING_PERF_GATE_MIN_NET_AVG_PCT: ${TRADING_PERF_GATE_MIN_NET_AVG_PCT:-0.3}
      TRADING_PERF_GATE_HORIZON: ${TRADING_PERF_GATE_HORIZON:-exit}
      TRADING_PERF_GATE_FALLBACK_ENABLED: ${TRADING_PERF_GATE_FALLBACK_ENABLED:-false}
      TRADING_PERF_GATE_FALLBACK_MIN_SAMPLES: ${TRADING_PERF_GATE_FALLBACK_MIN_SAMPLES:-50}
      TRADING_PERF_GATE_FALLBACK_MIN_NET_AVG_PCT: ${TRADING_PERF_GATE_FALLBACK_MIN_NET_AVG_PCT:-0.5}
      TRADING_PERF_GATE_FALLBACK_SIZE_MULT: ${TRADING_PERF_GATE_FALLBACK_SIZE_MULT:-0.5}
      TRADING_PERF_GATE_INVERSE_MIN_SAMPLES: ${TRADING_PERF_GATE_INVERSE_MIN_SAMPLES:-10}
      TRADING_PERF_GATE_INVERSE_BOOTSTRAP_SIZE_MULT: ${TRADING_PERF_GATE_INVERSE_BOOTSTRAP_SIZE_MULT:-0.3}
      TRADING_PERF_GATE_FLOW_CONDITIONAL: ${TRADING_PERF_GATE_FLOW_CONDITIONAL:-true}
      TRADING_PERF_GATE_FLOW_MIN_SAMPLES: ${TRADING_PERF_GATE_FLOW_MIN_SAMPLES:-30}
      TRADING_PERF_GATE_BREADTH_CONDITIONAL: ${TRADING_PERF_GATE_BREADTH_CONDITIONAL:-false}
      TRADING_PERF_GATE_BREADTH_MIN_SAMPLES: ${TRADING_PERF_GATE_BREADTH_MIN_SAMPLES:-20}
      TRADING_PERF_GATE_NET_TREND_CONDITIONAL: ${TRADING_PERF_GATE_NET_TREND_CONDITIONAL:-false}
      TRADING_PERF_GATE_NET_TREND_MIN_DAYS: ${TRADING_PERF_GATE_NET_TREND_MIN_DAYS:-5}
      TRADING_PERF_GATE_NET_TREND_UP_PCT: ${TRADING_PERF_GATE_NET_TREND_UP_PCT:-0.05}
      TRADING_PERF_GATE_NET_TREND_DOWN_PCT: ${TRADING_PERF_GATE_NET_TREND_DOWN_PCT:-0.05}
      TRADING_PERF_GATE_NET_TREND_LAST_DAY_MIN_PCT: ${TRADING_PERF_GATE_NET_TREND_LAST_DAY_MIN_PCT:-0}
      TRADING_PERF_GATE_NET_TREND_CLOSES_BOOTSTRAP: ${TRADING_PERF_GATE_NET_TREND_CLOSES_BOOTSTRAP:-false}
      TRADING_RISK_BEAR_BLOCK_ENABLED: ${TRADING_RISK_BEAR_BLOCK_ENABLED:-false}
      TRADING_PERF_GATE_INVERSE_REALIZED_SINCE: ${TRADING_PERF_GATE_INVERSE_REALIZED_SINCE:-}
      TRADING_PERF_GATE_INVERSE_MIN_NET: ${TRADING_PERF_GATE_INVERSE_MIN_NET:-0}
      TRADING_PERF_GATE_CLOSE_NET_AVG_PCT: ${TRADING_PERF_GATE_CLOSE_NET_AVG_PCT:-0.3}
      TRADING_PERF_GATE_MAX_SINGLE_DAY_SHARE_PCT: ${TRADING_PERF_GATE_MAX_SINGLE_DAY_SHARE_PCT:-80}
      TRADING_PERF_GATE_LOO_TOP_DAY: ${TRADING_PERF_GATE_LOO_TOP_DAY:-true}
      TRADING_PERF_GATE_INVERSE_POOLED: ${TRADING_PERF_GATE_INVERSE_POOLED:-true}
