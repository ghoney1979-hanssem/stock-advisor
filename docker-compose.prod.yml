      SIGNAL_EXEC_OVERHEAT_MIN_STRENGTH: ${SIGNAL_EXEC_OVERHEAT_MIN_STRENGTH:-200.0}
      SIGNAL_EXEC_OVERHEAT_STRATEGIES: ${SIGNAL_EXEC_OVERHEAT_STRATEGIES:-SQUEEZE_BREAKOUT_H,RSI_REVERSAL_G,VALUE_REVERSAL_J}
      SIGNAL_RET5D_OVERHEAT_MAX_PCT: ${SIGNAL_RET5D_OVERHEAT_MAX_PCT:-10.0}
      # 일봉 히스토리 적재(백테스트용) 호출 간격 — 0이면 무지연
      DAILY_HISTORY_THROTTLE_MS: ${DAILY_HISTORY_THROTTLE_MS:-250}
      DAILY_HISTORY_REFRESH_ENABLED: ${DAILY_HISTORY_REFRESH_ENABLED:-false}
