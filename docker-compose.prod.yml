      TRADING_ADAPTIVE_EXIT_MAX_HOLD_MINUTES: ${TRADING_ADAPTIVE_EXIT_MAX_HOLD_MINUTES:-300}
      TRADING_ADAPTIVE_EXIT_SMOOTH_WINDOW: ${TRADING_ADAPTIVE_EXIT_SMOOTH_WINDOW:-3}
      TRADING_ADAPTIVE_EXIT_MAX_HOLD_PER_STRATEGY: ${TRADING_ADAPTIVE_EXIT_MAX_HOLD_PER_STRATEGY:-}
      TRADING_ADAPTIVE_EXIT_METHOD_ENABLED: ${TRADING_ADAPTIVE_EXIT_METHOD_ENABLED:-true}
      TRADING_ADAPTIVE_EXIT_METHOD_TREND_CONFIRM: ${TRADING_ADAPTIVE_EXIT_METHOD_TREND_CONFIRM:-3}
      TRADING_ADAPTIVE_EXIT_METHOD_MIN_HOLD_MIN: ${TRADING_ADAPTIVE_EXIT_METHOD_MIN_HOLD_MIN:-0}
      TRADING_ADAPTIVE_EXIT_METHOD_VWAP_BUFFER_PCT: ${TRADING_ADAPTIVE_EXIT_METHOD_VWAP_BUFFER_PCT:-0.0}
      TRADING_ADAPTIVE_STOP_ENABLED: ${TRADING_ADAPTIVE_STOP_ENABLED:-true}
      TRADING_SWING_TRAIL_ENABLED: ${TRADING_SWING_TRAIL_ENABLED:-true}
      TRADING_LIMIT_UP_LOCK_PCT: ${TRADING_LIMIT_UP_LOCK_PCT:-29.0}
      TRADING_INVERSE_EXIT_ENABLED: ${TRADING_INVERSE_EXIT_ENABLED:-true}
      TRADING_INVERSE_EXIT_RECOVERY_PCT: ${TRADING_INVERSE_EXIT_RECOVERY_PCT:-0.5}
      TRADING_INVERSE_EXIT_REBOUND_MOM_PCT: ${TRADING_INVERSE_EXIT_REBOUND_MOM_PCT:-0.3}
      TRADING_INVERSE_EXIT_REBOUND_DAY_SCALE: ${TRADING_INVERSE_EXIT_REBOUND_DAY_SCALE:-0.15}
      TRADING_INVERSE_EXIT_REBOUND_FROM_LOW_PCT: ${TRADING_INVERSE_EXIT_REBOUND_FROM_LOW_PCT:-1.0}
      TRADING_INVERSE_EXIT_STOP_PCT: ${TRADING_INVERSE_EXIT_STOP_PCT:-2.0}
      TRADING_INVERSE_EXIT_MAX_HOLD_MINUTES: ${TRADING_INVERSE_EXIT_MAX_HOLD_MINUTES:-300}
      TRADING_EXIT_ORDER_CUTOFF: ${TRADING_EXIT_ORDER_CUTOFF:-15:30}
      TRADING_EXIT_SESSION_CLOSE_AGGRESSIVE_PCT: ${TRADING_EXIT_SESSION_CLOSE_AGGRESSIVE_PCT:-0.0}
      # ATR 변동성기반 사이징 — 거래당 위험예산(소액계좌 대응 2.0%). 1주문 10% 하드캡은 별개로 유지.
      TRADING_SIZING_RISK_PER_TRADE_PCT: ${TRADING_SIZING_RISK_PER_TRADE_PCT:-2.0}
      TRADING_SIZING_ATR_MULT: ${TRADING_SIZING_ATR_MULT:-2.0}
      TRADING_SIZING_ATR_ENABLED: ${TRADING_SIZING_ATR_ENABLED:-true}
      # 신호 임계값 튜닝 knobs (compose가 명시 전달해야 컨테이너에 반영됨 — 아래 CLAUDE.md 함정 참조)
      SIGNAL_VOLUME_MULTIPLIER: ${SIGNAL_VOLUME_MULTIPLIER:-2.0}
      SIGNAL_MIN_OPINION_SCORE: ${SIGNAL_MIN_OPINION_SCORE:-40.0}
      SIGNAL_B_MIN_CHANGE: ${SIGNAL_B_MIN_CHANGE:-0.0}
      SIGNAL_B_MAX_CHANGE: ${SIGNAL_B_MAX_CHANGE:-1.0}
      SIGNAL_B_INVERSE_MAX_CHANGE: ${SIGNAL_B_INVERSE_MAX_CHANGE:-8.0}
      SIGNAL_B_INVERSE_REQUIRE_INDEX: ${SIGNAL_B_INVERSE_REQUIRE_INDEX:-true}
