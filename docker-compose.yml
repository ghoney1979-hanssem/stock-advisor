# 로컬 개발/테스트용 인프라 (PostgreSQL + Redis)
# 실행:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockadvisor-postgres
    environment:
      POSTGRES_DB: stockadvisor
      POSTGRES_USER: stockadvisor
      POSTGRES_PASSWORD: stockadvisor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockadvisor"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stockadvisor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
